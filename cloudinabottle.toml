[app]
name = "calibre-web"
version = "0.1.0"
description = "Calibre-Web ebook server with Cloud in a Bottle owner SSO"

[runtime.container]
image = "Dockerfile"
# Port 8080 is the auth-proxy sidecar inside the container. Calibre-Web
# itself binds 8083 internally; the sidecar terminates the OpenHost
# router's connection and forwards there with `X-Openhost-User: admin`
# stamped for owner-authenticated requests.
port = 8080

[routing]
# /login is one of the few Calibre-Web routes that returns 200 to
# unauthenticated requests without redirecting. The catch-all `/`
# returns a 302 to /login, which the OpenHost router treats as
# "alive but redirecting" — fine for liveness but `/login` is more
# explicit and avoids any future router behavior change.
health_check = "/login"
# Calibre-Web supports both owner SSO (via the auth-proxy stamping
# `X-Openhost-User: admin`) AND username/password login for invited
# readers, so the entire app needs to be reachable to anonymous traffic.
# Authentication then happens at the application layer.
public_paths = ["/"]

[resources]
# Default LSIO Calibre-Web image is hefty (Ubuntu noble + ImageMagick +
# Python 3 + Calibre-Web's own Python deps), and ImageMagick gets
# spawned for thumbnail generation on each cover. 768 MiB is what the
# upstream documentation recommends for "small library" deployments.
memory_mb = 768
# Measured clean --no-cache build peak ~1222 MiB (1.19 GiB), from
# pulling/extracting the linuxserver/calibre-web base image. Runtime
# memory_mb (768) is lower, so without an explicit build cap the build can
# OOM. Sized to the measured peak rounded up to the next 0.5 GiB.
build_memory_mb = 1536
cpu_millicores = 500

[data]
app_data = true
